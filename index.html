<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>XAI // BB-STYLE TERMINAL + LEDGER</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-adapter-date-fns/3.0.0/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#000;--panel:#0a0a0a;--panel2:#111;--border:#2a2a2a;--border-bright:#3d3d3d;--text:#e8e8e8;--muted:#8a8a8a;--amber:#ff8800;--amber-dim:#cc6e00;--amber-bright:#ffaa33;--yellow:#ffcc00;--green:#00c853;--red:#ff1744;--red-dim:#c62828;--blue:#2979ff;--cyan:#00e5ff;--purple:#b388ff;--gold:#C9A961;--gold-dim:rgba(201,169,97,.14);--pos:#3FB68B;--pos-dim:rgba(63,182,139,.12);--neg:#E0645A;--neg-dim:rgba(224,100,90,.12);--radius:3px;--surface:#151B23;--surface-2:#1B222C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Consolas,"Lucida Console","Courier New",monospace;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.35;font-size:12px;overflow-x:hidden}
.bb-topbar{background:var(--amber);color:#000;padding:3px 10px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:11px;letter-spacing:.5px;position:sticky;top:0;z-index:100}
.bb-topbar .logo{background:#000;color:var(--amber);padding:2px 8px;font-weight:900;letter-spacing:1px}
.bb-topbar .sep{color:#0006}
.bb-topbar .clock{margin-left:auto;font-variant-numeric:tabular-nums}
header{background:var(--panel2);border-bottom:1px solid var(--border-bright);padding:6px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
header .title{font-size:13px;font-weight:700;color:var(--amber);letter-spacing:1px}
header .title span{color:var(--muted);font-weight:400}
.account-bar{margin-left:auto;display:flex;gap:14px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.account-bar .metric{border-left:1px solid var(--border);padding-left:12px}
.account-bar .metric:first-child{border:none;padding-left:0}
.account-bar strong{color:var(--yellow)}
.account-bar .pos{color:var(--green)!important}
.account-bar .neg{color:var(--red)!important}
nav{display:flex;flex-wrap:wrap;gap:1px;padding:0;background:#1a1a1a;border-bottom:2px solid var(--amber)}
nav button{background:#1a1a1a;border:none;border-right:1px solid var(--border);color:var(--muted);padding:7px 10px;cursor:pointer;font-family:inherit;font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
nav button .fkey{display:block;font-size:9px;color:var(--amber-dim);font-weight:400;margin-bottom:1px}
nav button:hover{background:#252525;color:var(--text)}
nav button.active{background:var(--amber);color:#000}
nav button.active .fkey{color:#000}
main{padding:8px;max-width:100%}
.panel{background:var(--panel);border:1px solid var(--border);margin-bottom:6px}
.panel-hd{background:#1a1a1a;border-bottom:1px solid var(--border);padding:4px 8px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--amber);letter-spacing:.5px;text-transform:uppercase}
.panel-hd::before{content:"■";color:var(--amber);font-size:8px}
.panel-hd .right{margin-left:auto;font-weight:400;color:var(--muted);font-size:10px;text-transform:none;letter-spacing:0}
.panel-body{padding:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:1000px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.account-bar{margin-left:0;width:100%;flex-wrap:wrap}}
table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
th{background:#141414;color:var(--amber);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:5px 7px;text-align:left;border-bottom:1px solid var(--border-bright);white-space:nowrap}
td{padding:4px 7px;border-bottom:1px solid #1a1a1a;white-space:nowrap}
tr:nth-child(even) td{background:#080808}
tr:hover td{background:#1a1500}
td strong{color:#fff}
.btn{background:var(--amber);color:#000;border:none;padding:5px 12px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.btn:hover{background:var(--amber-bright)}
.btn.secondary{background:#222;color:var(--text);border:1px solid var(--border-bright)}
.btn.secondary:hover{background:#333;border-color:var(--amber-dim)}
.btn.danger{background:var(--red-dim);color:#fff}
.btn.danger:hover{background:var(--red)}
.btn.sm{padding:3px 8px;font-size:10px}
.btn.go{background:var(--amber);color:#000;font-weight:900;padding:5px 16px}
.btn.ghost{background:none;border:1px solid transparent;color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1B1508}
input,select,textarea{background:#000;border:1px solid var(--border-bright);color:var(--yellow);padding:5px 8px;font-family:inherit;font-size:12px;width:100%;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);background:#0a0800}
label{display:block;font-size:9px;color:var(--amber-dim);margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:8px}
.card{background:#0a0a0a;border:1px solid var(--border);padding:8px 10px}
.card .label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.card .value{font-size:15px;font-weight:700;margin-top:2px;color:var(--yellow);font-variant-numeric:tabular-nums}
.action-badge{display:inline-block;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.action-BUY,.action-BUY_SCALP{background:var(--green);color:#000}
.action-SELL,.action-SELL_SCALP{background:var(--red);color:#fff}
.action-WAIT{background:#333;color:var(--muted)}
.action-STOP{background:var(--red);color:#fff;animation:blink 1s step-end infinite}
.action-INVERSE_IRON_CONDOR{background:var(--amber);color:#000}
@keyframes blink{50%{opacity:.5}}
.status{font-size:11px;color:var(--muted);padding:4px 0}
.status.ok{color:var(--green)}
.status.err{color:var(--red)}
.pos{color:var(--green)}
.neg{color:var(--red)}
.neutral{color:var(--muted)}
.tag{display:inline-block;padding:1px 6px;font-size:10px;font-weight:700;background:#222;color:var(--muted)}
.tag.up{background:#003311;color:var(--green)}
.tag.down{background:#330011;color:var(--red)}
.tag.side{background:#222;color:var(--muted)}
.tag.bull{background:#003311;color:var(--green)}
.tag.bear{background:#330011;color:var(--red)}
.tag.war{background:#3d0000;color:#ff5252}
.tag.br{background:#003322;color:#69f0ae}
.tag.global{background:#001a33;color:#40c4ff}
.tag.day{background:var(--gold-dim);color:var(--gold)}
.tag.swing{background:rgba(122,162,247,.14);color:#7AA2F7}
.tag.holding{background:var(--pos-dim);color:var(--pos)}
.tag.long{background:var(--pos-dim);color:var(--pos)}
.tag.short{background:var(--neg-dim);color:var(--neg)}
.tag.open{background:#222;color:var(--muted);border:1px solid var(--border)}
.hidden{display:none!important}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt-1{margin-top:6px}
.mb-1{margin-bottom:6px}
.hint{font-size:10px;color:var(--muted);margin-top:4px}
.ticker-tape{background:#0a0a0a;border-bottom:1px solid var(--border);overflow:hidden;white-space:nowrap;padding:3px 0;font-size:11px;font-variant-numeric:tabular-nums}
.ticker-tape-inner{display:inline-block;animation:scroll-tape 45s linear infinite;padding-left:100%}
.ticker-tape .item{display:inline-block;margin-right:28px}
.ticker-tape .sym{color:var(--amber);font-weight:700}
.ticker-tape .px{color:var(--text)}
.ticker-tape .up{color:var(--green)}
.ticker-tape .dn{color:var(--red)}
@keyframes scroll-tape{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.cmdline{background:#0a0a0a;border-top:1px solid var(--border-bright);padding:5px 10px;display:flex;align-items:center;gap:8px;font-size:12px;position:sticky;bottom:0;z-index:50}
.cmdline .prompt{color:var(--amber);font-weight:700;white-space:nowrap}
.cmdline input{flex:1;background:transparent;border:none;color:var(--yellow);padding:2px 0;font-size:12px}
.cmdline input:focus{outline:none;background:transparent;border:none}
.cmdline .hint-keys{color:var(--muted);font-size:10px;white-space:nowrap}
footer{text-align:center;padding:6px;color:#444;font-size:9px;border-top:1px solid var(--border);letter-spacing:.5px}
.news-item{border-bottom:1px solid #1a1a1a;padding:6px 0;font-size:11px}
.news-item:last-child{border-bottom:none}
.news-item .src{color:var(--amber-dim);font-size:9px;text-transform:uppercase;margin-right:6px}
.news-item .ttl{color:var(--text)}
.news-item .sent{float:right;font-size:10px;font-weight:700}
.sentiment-box{border:1px solid var(--border-bright);padding:8px;margin-bottom:8px;background:#0a0800}
.sentiment-box.bullish{border-color:var(--green)}
.sentiment-box.bearish{border-color:var(--red)}
.sentiment-box.mixed{border-color:var(--amber)}
.smc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;font-size:11px}
.smc-grid .k{color:var(--muted)}
.smc-grid .v{color:var(--yellow);font-weight:700}
.gamma-badge{display:inline-block;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:.3px;margin-left:8px;border-radius:2px}
.gamma-pos{background:#003311;color:var(--green);border:1px solid var(--green)}
.gamma-neg{background:#330011;color:var(--red);border:1px solid var(--red)}
.gamma-levels{font-size:10px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
.gamma-levels span{background:#111;padding:1px 6px;border:1px solid #2a2a2a;color:var(--yellow)}
/* Ledger / watchlist styles */
#asset-list{border-top:1px solid var(--border)}
.asset-row{display:grid;grid-template-columns:1fr 110px 110px 150px 90px;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px solid var(--border);cursor:pointer}
.asset-row:hover{background:#111}
.asset-symbol{font-weight:600;font-size:13px}
.asset-name{color:var(--muted);font-size:11px;margin-top:2px}
.asset-price{font-size:13px;text-align:right}
.asset-change{text-align:right;font-size:12px;padding:3px 7px;border-radius:var(--radius);justify-self:end}
.asset-change.pos{color:var(--pos);background:var(--pos-dim)}
.asset-change.neg{color:var(--neg);background:var(--neg-dim)}
.asset-spark{width:100%;height:28px}
.empty-state{padding:40px 10px;text-align:center;color:var(--muted);border:1px dashed var(--border);margin-top:10px}
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-chip{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 11px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer}
.filter-chip.active{border-color:var(--amber);color:var(--amber);background:rgba(255,136,0,.12)}
.entry-card{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.entry-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.entry-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.entry-asset{font-weight:600;font-size:13px}
.entry-pl{font-size:13px;font-weight:600}
.entry-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:10px;font-size:11px}
.entry-meta div span{display:block;color:var(--muted);font-size:10px;margin-bottom:2px}
.entry-notes{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.4}
.entry-actions{margin-top:10px;display:flex;gap:6px}
.plan-editor{width:100%;min-height:380px;background:#0a0a0a;border:1px solid var(--border);color:var(--text);padding:12px;font-family:Consolas,monospace;font-size:12px;line-height:1.55;resize:vertical}
#plan-render{line-height:1.65;font-size:13px}
#plan-render h2{font-size:14px;color:var(--amber);margin:18px 0 8px}
#plan-render h3{font-size:13px;margin:14px 0 6px}
#plan-render ul{margin:4px 0;padding-left:18px}
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.analytics-card{background:var(--panel);border:1px solid var(--border);padding:12px}
.analytics-card h3{margin:0 0 10px;font-size:12px;color:var(--muted)}
.analytics-chart{height:240px;position:relative}
.portfolio-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--border);padding:10px}
.kpi-label{font-size:10px;color:var(--muted);margin-bottom:4px}
.kpi-value{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.position-row{display:grid;grid-template-columns:1fr 110px 110px 90px 100px 90px;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--border)}
.position-row:first-child{border-top:1px solid var(--border);font-weight:700;color:var(--amber);font-size:10px;text-transform:uppercase}
.position-symbol{font-weight:600}
.position-muted{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.return-pos{color:var(--green)}
.return-neg{color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal[hidden]{display:none}
.modal-content{background:var(--panel2);border:1px solid var(--border-bright);border-radius:4px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;padding:18px 20px;position:relative}
.modal-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.status-box{padding:10px;border:1px solid var(--border);background:var(--panel);margin-bottom:12px;font-size:12px;line-height:1.45}
.chart-grid-layout{display:grid;grid-template-columns:220px 1fr 320px;gap:8px}
@media(max-width:1200px){.chart-grid-layout{grid-template-columns:1fr}}
.dom-column,.left-column{display:flex;flex-direction:column;gap:6px}
.superdom-table{width:100%;border-collapse:collapse;font-size:10px;font-variant-numeric:tabular-nums;table-layout:fixed}
.superdom-table th{padding:3px 4px;text-align:center;font-size:9px;background:#111;border-bottom:1px solid var(--border-bright)}
.superdom-table td{padding:2px 4px;height:20px;text-align:center;border-bottom:1px solid #141414;position:relative}
.superdom-table tr.ask-row td.price-cell{color:var(--red);background:rgba(255,23,68,0.05)}
.superdom-table tr.bid-row td.price-cell{color:var(--green);background:rgba(0,200,83,0.05)}
.superdom-table tr.current-price td{background:#3d3100!important;font-weight:700;color:var(--yellow)!important;border-top:1px solid var(--amber);border-bottom:1px solid var(--amber)}
.dom-bar-bg{position:absolute;top:1px;bottom:1px;opacity:.25;pointer-events:none}
.dom-bar-ask{right:0;background:var(--red)}
.dom-bar-bid{left:0;background:var(--green)}
.vp-container{max-height:200px;overflow-y:auto}
.vp-row{display:flex;align-items:center;font-size:9px;gap:4px;padding:1px 0;border-bottom:1px solid #121212}
.vp-price{width:55px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.vp-bar-wrapper{flex:1;background:#080808;height:12px;position:relative;border-radius:2px;overflow:hidden;display:flex}
.vp-bar-buy{background:var(--green);opacity:.7;height:100%}
.vp-bar-sell{background:var(--red);opacity:.7;height:100%}
.vp-vol-text{width:45px;font-size:8px;color:var(--amber);text-align:right;font-variant-numeric:tabular-nums}
.vp-poc{background:#2b2200;border:1px solid var(--yellow)}
.vp-poc .vp-price{color:var(--yellow);font-weight:700}
#chartContainer,#stdContainer,#deltaContainer,#rsiContainer{position:relative;background:#000}
#chartContainer{height:280px}
#stdContainer,#deltaContainer,#rsiContainer{height:90px}
.chart-news-bar{background:#0a0800;border:1px solid var(--border-bright);border-left:3px solid var(--amber);padding:6px 8px;margin-bottom:6px;font-size:11px}
.chart-news-bar .nb-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.chart-news-bar .nb-label{color:var(--amber);font-weight:700;font-size:9px;letter-spacing:.5px;white-space:nowrap;text-transform:uppercase}
.chart-news-bar .nb-bias{font-size:10px;font-weight:700;padding:1px 6px;margin-left:auto}
.chart-news-bar .nb-rows{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chart-news-bar .nb-cat{font-size:9px;color:var(--amber-dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;font-weight:700}
.chart-news-bar .nb-item{color:var(--text);font-size:10px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.chart-news-bar .nb-rows{grid-template-columns:1fr}.analytics-grid{grid-template-columns:1fr}.portfolio-kpis{grid-template-columns:1fr 1fr}.position-row{grid-template-columns:1fr 90px 110px}.position-row>:nth-child(3),.position-row>:nth-child(4){display:none}.asset-row{grid-template-columns:1fr 90px 90px}.asset-spark,.asset-actions{display:none}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#333}
::-webkit-scrollbar-thumb:hover{background:var(--amber-dim)}
</style>
</head>
<body>
<div class="bb-topbar">
  <span class="logo">XAI</span>
  <span>MICROSTRUCTURE</span><span class="sep">|</span>
  <span>ORDERFLOW</span><span class="sep">|</span>
  <span>SMC / ICT</span><span class="sep">|</span>
  <span>GAMMA</span><span class="sep">|</span>
  <span>LEDGER</span>
  <span class="clock" id="bbClock">--:--:--</span>
</div>

<header>
  <div class="title">XAI TERMINAL <span>// KEYLESS · YAHOO + LEDGER</span></div>
  <div class="account-bar">
    <div class="metric">EQUITY <strong id="hdrEquity">100,000</strong></div>
    <div class="metric">DAY P/L <strong id="hdrDayPnl" class="pos">0.00</strong></div>
    <div class="metric">OPEN <strong id="hdrOpen">0</strong></div>
    <div class="metric">MODE <strong id="bbMode">MONITOR</strong></div>
  </div>
</header>

<nav id="nav">
  <button data-tab="dashboard" class="active"><span class="fkey">F1</span>MONITOR</button>
  <button data-tab="watchlist"><span class="fkey">F2</span>WATCHLIST</button>
  <button data-tab="portfolio"><span class="fkey">F3</span>PORTFOLIO</button>
  <button data-tab="journal"><span class="fkey">F4</span>JOURNAL</button>
  <button data-tab="analytics"><span class="fkey">F5</span>ANALYTICS</button>
  <button data-tab="plan"><span class="fkey">F6</span>PLAN</button>
  <button data-tab="chart"><span class="fkey">F7</span>CHART</button>
  <button data-tab="news"><span class="fkey">F8</span>NEWS</button>
  <button data-tab="log"><span class="fkey">F9</span>LOG</button>
  <button data-tab="settings"><span class="fkey">F10</span>SETTINGS</button>
</nav>

<main>
  <!-- DASHBOARD / MONITOR -->
  <div id="tab-dashboard" class="tab">
    <div class="panel">
      <div class="panel-hd">SYSTEM STATUS <span class="right" id="sysStatus">READY · KEYLESS</span></div>
      <div class="panel-body">
        <div class="grid-4">
          <div class="card"><div class="label">LIVE FEED</div><div class="value" id="liveFeedStatus">YAHOO</div></div>
          <div class="card"><div class="label">WATCHLIST</div><div class="value" id="wlCount">0</div></div>
          <div class="card"><div class="label">POSITIONS</div><div class="value" id="posCount">0</div></div>
          <div class="card"><div class="label">JOURNAL</div><div class="value" id="jCount">0</div></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-hd">QUICK TICKER
